trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: UseDotNet@2
  inputs:
    packageType: 'sdk'
    version: '10.x'

- task: DotNetCoreCLI@2
  inputs:
    command: 'restore'
    projects: 'AzureServiceBusDemo/Mvc/Mvc.csproj'

- task: DotNetCoreCLI@2
  inputs:
    command: 'build'
    projects: 'AzureServiceBusDemo/Mvc/Mvc.csproj'
    arguments: '--configuration Release'

- task: DotNetCoreCLI@2
  inputs:
    command: 'publish'
    publishWebProjects: false
    projects: 'AzureServiceBusDemo/Mvc/Mvc.csproj'
    arguments: '--configuration Release --output $(Build.ArtifactStagingDirectory)'
    zipAfterPublish: true

- task: AzureWebApp@1
  inputs:
    azureSubscription: 'AzureServiceConnectionNameResourceGroup1'
    appName: 'AzureServiceBusDemoMvc'
    package: '$(Build.ArtifactStagingDirectory)/**/*.zip'
